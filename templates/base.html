<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CalcTrick – Kalkulator web cerdas">
    <title>{% block title %}Beranda{% endblock %} | CalcTrick</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- ──────────── NAVBAR ──────────── -->
<nav class="navbar navbar-expand-lg fixed-top glass-nav" id="mainNavbar">
    <div class="container-xl">
        <!-- Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
            <div class="brand-icon">
                <i class="bi bi-calculator-fill"></i>
            </div>
            <span class="brand-text">Calc<span class="brand-accent">Trick</span></span>
        </a>

        <!-- Toggle -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav links -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav mx-auto gap-1">
                <li class="nav-item">
                    <a class="nav-link nav-pill {% if request.endpoint == 'index' %}active{% endif %}"
                       href="{{ url_for('index') }}">
                        <i class="bi bi-house-fill me-1"></i>Beranda
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-pill {% if request.endpoint == 'aritmatika' %}active{% endif %}"
                       href="{{ url_for('aritmatika') }}">
                        <i class="bi bi-plus-slash-minus me-1"></i>Aritmatika
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-pill {% if request.endpoint == 'logika' %}active{% endif %}"
                       href="{{ url_for('logika') }}">
                        <i class="bi bi-diagram-3-fill me-1"></i>Logika
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-pill {% if request.endpoint == 'transformasi' %}active{% endif %}"
                       href="{{ url_for('transformasi') }}">
                        <i class="bi bi-arrow-left-right me-1"></i>Transformasi
                    </a>
                </li>
            </ul>

            <!-- Dark/Light Toggle -->
            <div class="d-flex align-items-center gap-3">
                <button class="theme-toggle" id="themeToggle" title="Ganti Tema" aria-label="Toggle tema">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- ──────────── MAIN CONTENT ──────────── -->
<main class="main-content">
    {% block content %}{% endblock %}
</main>

<!-- ──────────── FOOTER ──────────── -->
<footer class="site-footer">
    <div class="container-xl">
        <div class="footer-inner">
            <div class="footer-brand">
                <i class="bi bi-calculator-fill me-2"></i>
                <strong>CalcTrick</strong>
            </div>
            <p class="footer-desc">
                Kalkulator web untuk aritmatika, logika, dan transformasi bilangan.
            </p>
            <div class="footer-links">
                <a href="{{ url_for('index') }}">Beranda</a>
                <a href="{{ url_for('aritmatika') }}">Aritmatika</a>
                <a href="{{ url_for('logika') }}">Logika</a>
                <a href="{{ url_for('transformasi') }}">Transformasi</a>
            </div>
        </div>
        <div class="footer-bottom">
            <span>© 2026 CalcTrick</span>
        </div>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
