<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CalcTrick – Kalkulator web cerdas dengan aritmatika, logika, dan transformasi bilangan">
    <title>{% block title %}Beranda{% endblock %} | CalcTrick</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- ──────────── TOP BAR ──────────── -->
<header class="top-bar">
    <a class="top-bar-brand" href="{{ url_for('index') }}">
        <div class="brand-icon-sm">
            <i class="bi bi-calculator-fill" style="color:#7effb2"></i>
        </div>
        <span class="brand-name">Calc<span>Trick</span></span>
    </a>

    <nav class="top-bar-nav">
        <a class="nav-chip {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
            <i class="bi bi-house-fill"></i> Beranda
        </a>
        <a class="nav-chip {% if request.endpoint == 'aritmatika' %}active{% endif %}" href="{{ url_for('aritmatika') }}">
            <i class="bi bi-plus-slash-minus"></i> Aritmatika
        </a>
        <a class="nav-chip {% if request.endpoint == 'logika' %}active{% endif %}" href="{{ url_for('logika') }}">
            <i class="bi bi-diagram-3-fill"></i> Logika
        </a>
        <a class="nav-chip {% if request.endpoint == 'transformasi' %}active{% endif %}" href="{{ url_for('transformasi') }}">
            <i class="bi bi-arrow-left-right"></i> Transformasi
        </a>
    </nav>

    <!-- Mobile menu placeholder -->
    <div style="flex:1" class="d-md-none"></div>
</header>

<!-- ──────────── MAIN ──────────── -->
<div class="app-wrapper">
    <div class="calc-scene">
        {% block content %}{% endblock %}
    </div>
</div>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
